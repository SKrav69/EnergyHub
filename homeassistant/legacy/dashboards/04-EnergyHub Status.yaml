type: grid
columns: 1
square: false
cards:
  - type: tile
    entity: input_boolean.name_energyhub_autopilot
    name: EnergyHub Autopilot
    icon: mdi:robot
    color: green
    features_position: bottom
    vertical: false
  - type: markdown
    content: |
      ## EnergyHub Status

      {% set mode = states('sensor.energyhub_operating_mode') %}

      {% if mode == 'solar' %}
        # ☀️ SOLAR
      {% elif mode == 'hybrid_charging' %}
        # 🌙 HYBRID CHARGING
      {% elif mode == 'hybrid_grid_hold' %}
        # 🌙 HYBRID GRID HOLD
      {% elif mode == 'panic' %}
        # 🔴 PANIC
      {% elif mode == 'away' %}
        # 🏠 AWAY
      {% elif mode == 'transitioning' %}
        # 🔄 TRANSITIONING
      {% elif mode == 'transition_failed' %}
        # ❌ TRANSITION FAILED
      {% else %}
        # ⚪ UNKNOWN
      {% endif %}

      {{ states('sensor.energyhub_operating_mode_reason') }}
  - type: entities
    show_header_toggle: false
    entities:
      - entity: sensor.energyhub_output_source_priority
        name: Output Source Priority
      - entity: sensor.energyhub_charger_source_priority
        name: Charger Source Priority
      - entity: sensor.energyhub_communication_status
        name: Communication
      - entity: sensor.powmr_10_2m_battery_soc
        name: Battery SOC
      - entity: sensor.powmr_10_2m_battery_charging_current
        name: Battery Charging Current
      - entity: sensor.powmr_10_2m_battery_discharge_current
        name: Battery Discharge Current
      - entity: sensor.powmr_10_2m_output_power
        name: House Load
      - entity: sensor.powmr_10_2m_pv1_power
        name: PV1 Power
      - entity: sensor.powmr_10_2m_grid_voltage
        name: Grid Voltage
