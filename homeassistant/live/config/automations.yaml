- id: '1781793005552'
  alias: EnergyHub Beacon
  description: 'Color shows battery reserve. Brightness and animation show the real
    electrical state. Solid white means EnergyHub telemetry has stopped.

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_grid_voltage
    - sensor.powmr_10_2m_output_power
    - sensor.energyhub_output_source_priority
    - sensor.energyhub_telemetry_freshness
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  actions:
  - variables:
      soc: '{{ states(''sensor.powmr_10_2m_battery_soc'') | float(-1) }}

        '
      grid_voltage: '{{ states(''sensor.powmr_10_2m_grid_voltage'') | float(0) }}

        '
      grid_available: '{{ grid_voltage > 50 }}

        '
      output_source_priority: '{{ states(''sensor.energyhub_output_source_priority'')
        | upper }}

        '
      using_grid_intentionally: '{{ output_source_priority == ''SUB'' }}

        '
      freshness_state: '{{ states(''sensor.energyhub_telemetry_freshness'') | lower
        }}

        '
      output_power_age_seconds: "{{\n  as_timestamp(now())\n  -\n  as_timestamp(\n
        \   states.sensor.powmr_10_2m_output_power.last_reported,\n    0\n  )\n}}\n"
      telemetry_ok: "{{\n  freshness_state == 'fresh'\n  and output_power_age_seconds
        < 90\n}}\n"
      lamp_color: "{% if soc >= 95 %}\n  [0, 80, 255]\n{% elif soc >= 80 %}\n  [0,
        255, 0]\n{% elif soc >= 50 %}\n  [255, 220, 0]\n{% elif soc >= 30 %}\n  [255,
        80, 0]\n{% else %}\n  [128, 0, 32]\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not telemetry_ok }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.colorful_pir_night_light
        data:
          brightness_pct: 40
          rgb_color:
          - 255
          - 255
          - 255
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc >= 0 and soc < 30 }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: "{{\n  states('sensor.powmr_10_2m_battery_soc')\n  | float(100)
              < 30\n}}\n"
          - condition: template
            value_template: "{{\n  states('sensor.energyhub_telemetry_freshness')\n
              \ | lower == 'fresh'\n  and\n  (\n    as_timestamp(now())\n    -\n    as_timestamp(\n
              \     states.sensor.powmr_10_2m_output_power.last_reported,\n      0\n
              \   )\n  ) < 90\n}}\n"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.colorful_pir_night_light
            data:
              brightness_pct: 10
              rgb_color:
              - 128
              - 0
              - 32
          - delay: 00:00:02
          - action: light.turn_on
            target:
              entity_id: light.colorful_pir_night_light
            data:
              brightness_pct: 50
              rgb_color:
              - 128
              - 0
              - 32
          - delay: 00:00:02
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and soc >= 30 and not grid_available }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: "{{\n  states('sensor.powmr_10_2m_grid_voltage')\n  |
              float(0) <= 50\n}}\n"
          - condition: template
            value_template: "{{\n  states('sensor.powmr_10_2m_battery_soc')\n  | float(100)
              >= 30\n}}\n"
          - condition: template
            value_template: "{{\n  states('sensor.energyhub_telemetry_freshness')\n
              \ | lower == 'fresh'\n  and\n  (\n    as_timestamp(now())\n    -\n    as_timestamp(\n
              \     states.sensor.powmr_10_2m_output_power.last_reported,\n      0\n
              \   )\n  ) < 90\n}}\n"
          sequence:
          - repeat:
              for_each:
              - 10
              - 30
              - 50
              - 30
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.colorful_pir_night_light
                data:
                  brightness_pct: '{{ repeat.item }}'
                  rgb_color: '{{ lamp_color }}'
              - delay: 00:00:01
    - conditions:
      - condition: template
        value_template: '{{ telemetry_ok and using_grid_intentionally }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.colorful_pir_night_light
        data:
          brightness_pct: 100
          rgb_color: '{{ lamp_color }}'
    default:
    - condition: template
      value_template: '{{ telemetry_ok and soc >= 0 }}'
    - action: light.turn_on
      target:
        entity_id: light.colorful_pir_night_light
      data:
        brightness_pct: 40
        rgb_color: '{{ lamp_color }}'
  mode: restart
- id: '1783102330433'
  alias: EnergyHub - Daily Solar Surplus Estimated Snapshot
  description: Store estimated unused solar energy before daily sensors reset
  triggers:
  - at: '23:50:00'
    trigger: time
  actions:
  - target:
      entity_id: input_number.energyhub_daily_solar_surplus_estimated
    data:
      value: '{{ surplus }}'
    action: input_number.set_value
  variables:
    forecast: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') | float(0)
      }}'
    consumption: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'') | float(0)
      }}'
    surplus: '{{ [0, forecast - consumption] | max | round(1) }}'
  mode: single
- id: '1783103977336'
  alias: EnergyHub - Floor 3 Heat Pump Auto Off
  description: Auto-off timer for 3rd floor heat pump plug
  triggers:
  - entity_id: switch.chuangmi_212a01_ea40_switch
    to: 'on'
    id: pump_on
    trigger: state
  - entity_id: switch.chuangmi_212a01_ea40_switch
    to: 'off'
    id: pump_off
    trigger: state
  - entity_id: input_number.input_number_floor3_heat_pump_timer_hours
    id: timer_changed
    trigger: state
  - event_type: timer.finished
    event_data:
      entity_id: timer.floor_3_heat_pump_auto_off
    id: timer_finished
    trigger: event
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''pump_on'', ''timer_changed''] }}

          '
      - condition: state
        entity_id: switch.chuangmi_212a01_ea40_switch
        state: 'on'
      - condition: template
        value_template: '{{ states(''input_number.input_number_floor3_heat_pump_timer_hours'')
          | int(0) > 0 }}

          '
      sequence:
      - target:
          entity_id: timer.floor_3_heat_pump_auto_off
        data:
          duration: '{{ ''%02d:00:00'' % (states(''input_number.input_number_floor3_heat_pump_timer_hours'')
            | int(0)) }}

            '
        action: timer.start
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''pump_off'' }}

          '
      sequence:
      - target:
          entity_id: timer.floor_3_heat_pump_auto_off
        action: timer.cancel
      - target:
          entity_id: input_number.input_number_floor3_heat_pump_timer_hours
        data:
          value: 0
        action: input_number.set_value
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''timer_finished'' }}

          '
      sequence:
      - target:
          entity_id: switch.chuangmi_212a01_ea40_switch
        action: switch.turn_off
      - target:
          entity_id: input_number.input_number_floor3_heat_pump_timer_hours
        data:
          value: 0
        action: input_number.set_value
  mode: restart
- id: '1783245343717'
  alias: EnergyHub - Publish Daily Summary Inputs
  description: Publishes decision inputs before 23:50 and one atomic Daily Summary snapshot at 23:51.
  triggers:
  - trigger: time
    at: '23:49:00'
    id: before_hybrid_decision
  - trigger: time
    at: '23:51:00'
    id: final_daily_snapshot
  conditions: []
  actions:
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_house_consumption
      payload: '{{ states(''sensor.powmr_10_2m_daily_house_consumption'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/daily_solar_surplus_estimated
      payload: '{{ states(''input_number.energyhub_daily_solar_surplus_estimated'') }}'
      retain: true
  - choose:
    - conditions:
      - condition: trigger
        id: final_daily_snapshot
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/daily_summary_snapshot
          payload: >-
            {{ {
              'date': now().strftime('%Y-%m-%d'),
              'timestamp': as_timestamp(now()) | int,
              'daily_house_consumption': states('sensor.powmr_10_2m_daily_house_consumption'),
              'solar_forecast_today': states('sensor.solcast_pv_forecast_forecast_today'),
              'solar_forecast_tomorrow': states('sensor.solcast_pv_forecast_forecast_tomorrow'),
              'daily_solar_surplus_estimated': states('input_number.energyhub_daily_solar_surplus_estimated')
            } | tojson }}
          retain: true
  mode: single
- id: '1784300000001'
  alias: EnergyHub - Publish Live Solcast Forecasts
  description: Publishes live Solcast forecast changes for EnergyHub decision engines without creating Daily Summary snapshots.
  triggers:
  - trigger: state
    entity_id:
    - sensor.solcast_pv_forecast_forecast_today
    - sensor.solcast_pv_forecast_forecast_tomorrow
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      seconds: 5
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_today_live
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_today'') }}'
      retain: true
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/solar_forecast_tomorrow_live
      payload: '{{ states(''sensor.solcast_pv_forecast_forecast_tomorrow'') }}'
      retain: true
  mode: restart
- id: '1783697064742'
  alias: EnergyHub - Publish Autopilot State
  description: Publishes the EnergyHub Autopilot helper state to MQTT.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.energyhub_autopilot
  - trigger: homeassistant
    event: start
  actions:
  - delay:
      seconds: 5
  - action: mqtt.publish
    data:
      topic: energyhub/input/ha/autopilot
      payload: '{{ states(''input_boolean.energyhub_autopilot'') }}'
      retain: true
  mode: restart
- id: '1783705009942'
  alias: EnergyHub - Hybrid Schedule
  description: Evaluates Hybrid at 23:50 and restores Solar at 07:00.
  triggers:
  - trigger: time
    at: '23:50:00'
    id: evaluate_hybrid
  - trigger: time
    at: 07:00:00
    id: restore_solar
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - evaluate_hybrid
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: evaluate_hybrid
          retain: false
    - conditions:
      - condition: trigger
        id:
        - restore_solar
      - condition: state
        entity_id: input_boolean.energyhub_autopilot
        state: 'on'
      sequence:
      - action: mqtt.publish
        data:
          topic: energyhub/input/ha/inverter_mode
          payload: solar
          retain: false
    default:
    - action: mqtt.publish
      data:
        topic: energyhub/input/ha/inverter_mode
        payload: evaluate_hybrid
        retain: false
  mode: single
- id: '1783953087633'
  alias: EnergyHub - Mode Notifications
  description: Shows notifications when EnergyHub automatically activates Hybrid or
    Panic.
  triggers:
  - trigger: mqtt
    topic: energyhub/event/notification
  conditions: []
  actions:
  - variables:
      event: '{{ trigger.payload_json }}'
      mode: '{{ event.mode | default(''unknown'') }}'
      soc: '{{ event.soc | default(''unknown'') }}'
      target_soc: '{{ event.target_soc | default(''unknown'') }}'
      reason: '{{ event.reason | default(''No reason provided'') }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mode == ''hybrid'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F319 EnergyHub: Hybrid activated"
          notification_id: energyhub_hybrid
          message: 'Battery SOC: {{ soc }}%

            Tomorrow forecast: {{ event.forecast | round(2) }} kWh

            Required energy: {{ event.required_energy | round(2) }} kWh

            Target SOC: {{ target_soc }}%

            EnergyHub will keep the house on the night grid until 07:00.

            Reason: {{ reason }}'
    - conditions:
      - condition: template
        value_template: '{{ mode == ''panic'' }}'
      sequence:
      - action: persistent_notification.create
        data:
          title: "\U0001F6A8 EnergyHub: Panic activated"
          notification_id: energyhub_panic
          message: 'Battery SOC: {{ soc }}%

            Grid confidence: {{ event.grid_confidence | default(''unknown'') }}

            Solar forecast: {{ event.forecast | round(2) }} kWh

            Target SOC: {{ target_soc }}%

            Reason: {{ reason }}'
  mode: queued
  max: 10
- id: '1783955060074'
  alias: EnergyHub - Away Mode Heat Pump
  description: Controls the first-floor heat pump only while Away Mode owns it.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.energyhub_away_mode
    - sensor.miaomiaoce_t2_e515_temperature
    - sensor.powmr_10_2m_battery_soc
    - sensor.powmr_10_2m_pv1_power
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      away_enabled: '{{ is_state(''input_boolean.energyhub_away_mode'', ''on'') }}'
      away_heat_pump_active: "{{ is_state(\n  'input_boolean.energyhub_away_heat_pump_active',\n
        \ 'on'\n) }}"
      heat_pump_enabled: '{{ is_state(''switch.lumi_v1_64d7_switch'', ''on'') }}'
      temperature: "{{ states(\n  'sensor.miaomiaoce_t2_e515_temperature'\n) | float(999)
        }}"
      battery_soc: "{{ states(\n  'sensor.powmr_10_2m_battery_soc'\n) | float(-1)
        }}"
      pv_power: "{{ states(\n  'sensor.powmr_10_2m_pv1_power'\n) | float(-1) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not away_enabled }}'
      - condition: template
        value_template: '{{ away_heat_pump_active }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.lumi_v1_64d7_switch
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_away_heat_pump_active
      - action: logbook.log
        data:
          name: EnergyHub Away Mode
          message: Heat pump switched off because Away Mode was disabled.
    - conditions:
      - condition: template
        value_template: '{{ away_enabled }}'
      - condition: template
        value_template: '{{ not heat_pump_enabled }}'
      - condition: template
        value_template: '{{ temperature < 18 }}'
      - condition: template
        value_template: '{{ battery_soc > 95 }}'
      - condition: template
        value_template: '{{ pv_power > 200 }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.lumi_v1_64d7_switch
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energyhub_away_heat_pump_active
      - action: logbook.log
        data:
          name: EnergyHub Away Mode
          message: Heat pump switched on. Temperature={{ temperature }}°C, SOC={{
            battery_soc }}%, PV={{ pv_power }} W.
    - conditions:
      - condition: template
        value_template: '{{ away_enabled }}'
      - condition: template
        value_template: '{{ away_heat_pump_active }}'
      - condition: template
        value_template: '{{ temperature >= 23 or battery_soc <= 81 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.lumi_v1_64d7_switch
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energyhub_away_heat_pump_active
      - action: logbook.log
        data:
          name: EnergyHub Away Mode
          message: Heat pump switched off. Temperature={{ temperature }}°C, SOC={{
            battery_soc }}%.
  mode: restart