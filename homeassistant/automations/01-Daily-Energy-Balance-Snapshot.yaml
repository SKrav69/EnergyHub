alias: EnergyHub - Daily Energy Balance Snapshot
description: Store daily energy balance before daily sensors reset

trigger:
  - platform: time
    at: "23:50:00"

variables:
  forecast: "{{ states('sensor.solcast_pv_forecast_forecast_today') | float(0) }}"
  consumption: "{{ states('sensor.powmr_10_2m_daily_house_consumption') | float(0) }}"
  balance: "{{ (forecast - consumption) | round(1) }}"

action:
  - service: input_number.set_value
    target:
      entity_id: input_number.energyhub_daily_energy_balance
    data:
      value: "{{ balance }}"

mode: single