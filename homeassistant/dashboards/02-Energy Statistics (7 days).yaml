type: custom:apexcharts-card
header:
  show: true
  title: Energy Statistics (7 days)
  show_states: true
  colorize_states: true
graph_span: 7d
span:
  end: day
apex_config:
  chart:
    type: bar
    height: 350
  plotOptions:
    bar:
      columnWidth: 55%
  legend:
    show: true
  xaxis:
    type: datetime
    labels:
      format: dd MMM
series:
  - entity: sensor.powmr_10_2m_daily_house_consumption
    name: House Consumption
    type: column
    color: "#2980b9"
    float_precision: 1
    yaxis_id: kwh
    group_by:
      func: max
      duration: 1d
  - entity: input_number.energyhub_daily_solar_surplus_estimated
    name: Solar Surplus Estimated
    type: column
    color: "#e67e22"
    float_precision: 1
    yaxis_id: kwh
    group_by:
      func: max
      duration: 1d
  - entity: sensor.energyhub_grid_availability_24h
    name: Grid Availability
    type: line
    color: "#27ae60"
    stroke_width: 3
    float_precision: 1
    yaxis_id: grid
    group_by:
      func: avg
      duration: 1d
  - entity: sensor.solcast_pv_forecast_forecast_today
    name: ☀️ Forecast Today
    color: "#f1c40f"
    float_precision: 1
    show:
      in_chart: false
      in_header: true
  - entity: sensor.solcast_pv_forecast_forecast_tomorrow
    name: ☀️ Forecast Tomorrow
    color: "#f39c12"
    float_precision: 1
    show:
      in_chart: false
      in_header: true
yaxis:
  - id: kwh
    min: 0
    decimals: 1
    apex_config:
      title:
        text: kWh
  - id: grid
    opposite: true
    min: 0
    max: 100
    decimals: 0
    apex_config:
      title:
        text: Grid (%)
        style:
          color: "#27ae60"
      labels:
        style:
          colors: "#27ae60"
